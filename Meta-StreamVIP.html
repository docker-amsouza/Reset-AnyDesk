<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    background: transparent;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    margin: 0;
    padding: 10px;
  }
  .meta { color: #FFD700; }
  .falta { color: #FF6B6B; }
  .recebido { color: #4ADE80; }
  .link { color: #93C5FD; font-size: 14px; margin-top: 8px; }
  .completo { color: #FFD700; font-size: 22px; margin-top: 10px; display: none; }
</style>
</head>
<body>

<div class="meta">🎯 META: R$ 100,00</div>
<div class="recebido">✅ RECEBIDO: <span id="recebido">R$ 0,00</span></div>
<div class="falta">❌ FALTA: <span id="falta">R$ 100,00</span></div>
<div class="completo" id="concluido">🎉 META CONCLUÍDA! PARABÉNS! 🎉</div>
<div class="link">🔗 streamvip.com/amsouza</div>

<script>
// ==================================================
// ✅ É SÓ DIGITAR O VALOR AQUI E SALVAR!
// ==================================================
let valorRecebido = 17.77;  // ← EXEMPLO: 25.90   50.50   100

const META = 100;

function atualizarValores() {
  const falta = META - valorRecebido;

  document.getElementById("recebido").textContent = 
    "R$ " + valorRecebido.toFixed(2).replace(".", ",");

  document.getElementById("falta").textContent = 
    "R$ " + falta.toFixed(2).replace(".", ",");

  // ✅ Quando chegar a R$ 100,00 aparece mensagem de CONCLUÍDO!
  if (valorRecebido >= META) {
    document.getElementById("falta").style.display = "none";
    document.getElementById("concluido").style.display = "block";
  }
}

atualizarValores();
</script>

</body>
</html>
