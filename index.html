<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    padding: 10px;
    background: transparent;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .caixa {
    position: fixed;
    top: 8px;
    left: 8px;
    border: 2px solid #cc0000;
    border-radius: 10px;
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.60);
    box-shadow: 0 0 12px #cc0000, inset 0 0 8px rgba(204, 0, 0, 0.25);
    max-width: 220px;
    color: #fff;
    font-size: 13px;
    z-index: 9999;
  }
  .meta { 
    color: #ffd700; 
    font-size: 14px;
    text-shadow: 0 0 4px #ffd700;
    margin-bottom: 6px;
  }
  .falta { 
    color: #ff4d4d; 
    font-size: 12px;
    text-shadow: 0 0 3px #ff4d4d;
  }
  .recebido { 
    color: #4ade80; 
    font-size: 12px;
    text-shadow: 0 0 3px #4ade80;
  }
  .completo { 
    color: #ffd700; 
    font-size: 13px; 
    margin-top: 6px;
    display: none;
    text-shadow: 0 0 8px #ffd700;
    animation: brilho 1s ease-in-out infinite alternate;
  }
  .barra-fundo {
    height: 10px;
    background: #220000;
    border-radius: 5px;
    margin: 6px 0;
    border: 1px solid #cc0000;
    overflow: hidden;
  }
  .barra-porcentagem {
    height: 100%;
    background: linear-gradient(90deg, #990000, #ff0000, #ff3333);
    border-radius: 4px;
    width: 0%;
    transition: width 0.5s ease-out;
    box-shadow: 0 0 6px #ff0000;
  }
  @keyframes brilho {
    from { text-shadow: 0 0 4px #ffd700; }
    to   { text-shadow: 0 0 10px #ffd700; }
  }
</style>
</head>
<body>
<div class="caixa">
  <div class="meta">🎯 META: R$ 100,00</div>
  <div class="barra-fundo">
    <div class="barra-porcentagem" id="barra"></div>
  </div>
  <div class="recebido">✅ RECEBIDO: <span id="recebido">R$ 17,77</span></div>
  <div class="falta">❌ FALTA: <span id="falta">R$ 82,23</span></div>
  <div class="completo" id="concluido">🎉 META CONCLUÍDA! 🎉</div>
</div>
<script>
// ==================================================
// ✅ É SÓ DIGITAR O VALOR AQUI E SALVAR!
// ==================================================
let valorRecebido = 17.77; // ← Troca pelo valor
const META = 100; // ← Pode alterar a meta

function atualizarValores() {
  const falta = META - valorRecebido;
  const porcentagem = Math.min((valorRecebido / META) * 100, 100);
  
  document.getElementById("recebido").textContent = 
    "R$ " + valorRecebido.toFixed(2).replace(".", ",");
  document.getElementById("falta").textContent = 
    "R$ " + falta.toFixed(2).replace(".", ",");
  document.getElementById("barra").style.width = porcentagem + "%";
  
  if (valorRecebido >= META) {
    document.querySelector(".falta").style.display = "none";
    document.getElementById("concluido").style.display = "block";
    document.getElementById("barra").style.background = 
      "linear-gradient(90deg, #b8860b, #ffd700, #ffea00)";
    document.getElementById("barra").style.boxShadow = "0 0 8px #ffd700";
  }
}
atualizarValores();
</script>
</body>
</html>
